<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Basharat Reyaz — Developer Portfolio</title>
<desc id="desc">Animated dark blue and violet banner for a WordPress developer and technical support engineer.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1b"/><stop offset=".55" stop-color="#111b35"/><stop offset="1" stop-color="#241448"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#6366f1" stop-opacity=".42"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9db5ff" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<ellipse cx="950" cy="110" rx="330" ry="260" fill="url(#glow)"><animate attributeName="rx" values="280;360;280" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;1;.65" dur="7s" repeatCount="indefinite"/></ellipse>
<g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".55"><path d="M790 0 C700 110 930 150 830 360"><animate attributeName="stroke-dasharray" values="0 700;350 350;700 0" dur="12s" repeatCount="indefinite"/></path><path d="M940 0 C1080 100 850 230 1050 360"><animate attributeName="stroke-dasharray" values="700 0;350 350;0 700" dur="15s" repeatCount="indefinite"/></path></g>
<g fill="#a5b4fc" opacity=".65"><circle cx="930" cy="80" r="3"><animate attributeName="cy" values="80;55;80" dur="5s" repeatCount="indefinite"/></circle><circle cx="1080" cy="250" r="4"><animate attributeName="cy" values="250;220;250" dur="6s" repeatCount="indefinite"/></circle><circle cx="760" cy="270" r="2.5"><animate attributeName="cy" values="270;240;270" dur="4s" repeatCount="indefinite"/></circle><circle cx="1130" cy="110" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle></g>
<g transform="translate(76 82)"><rect width="56" height="4" rx="2" fill="url(#accent)"/><text x="0" y="78" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Basharat Reyaz</text><text x="2" y="125" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="23" letter-spacing="1.4">WORDPRESS DEVELOPER</text><text x="2" y="163" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="19">SaaS Support  •  PHP  •  Web Performance</text><text x="2" y="220" fill="#7dd3fc" font-family="Consolas,monospace" font-size="17">$ build  /  debug  /  improve</text></g>
<g transform="translate(1010 170)" opacity=".9"><circle r="82" fill="#0b1228" stroke="url(#accent)" stroke-width="2"/><circle r="68" fill="none" stroke="#818cf8" stroke-opacity=".35" stroke-dasharray="5 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="35s" repeatCount="indefinite"/></circle><text x="0" y="12" fill="#e0e7ff" font-family="Consolas,monospace" font-size="43" text-anchor="middle" font-weight="700">&lt;/&gt;</text></g>
</svg>