name: Update public repositories

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update public repository list
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repoName = context.repo.repo;
            const response = await github.rest.repos.listForUser({
              username: owner,
              type: "public",
              per_page: 100,
              sort: "updated"
            });

            const repos = response.data
              .filter(repo => repo.name.toLowerCase() !== repoName.toLowerCase())
              .sort((a, b) => a.name.localeCompare(b.name));

            const rows = repos.length
              ? repos.map(repo => {
                  const description = repo.description || "No description provided.";
                  return `| [${repo.name}](${repo.html_url}) | ${description.replace(/\\|/g, "\\|").replace(/\\r?\\n/g, " ")} |`;
                }).join("\\n")
              : "| No public repositories yet | — |";

            const section = [
              "<!-- PUBLIC-REPOS-START -->",
              "| Repository | Description |",
              "|---|---|",
              rows,
              "<!-- PUBLIC-REPOS-END -->"
            ].join("\\n");

            const { data: file } = await github.rest.repos.getContent({
              owner,
              repo: repoName,
              path: "README.md"
            });

            const current = Buffer.from(file.content, "base64").toString("utf8");
            const marker = /<!-- PUBLIC-REPOS-START -->[\\s\\S]*?<!-- PUBLIC-REPOS-END -->/;
            if (!marker.test(current)) {
              core.setFailed("Public repository markers were not found in README.md.");
              return;
            }

            const next = current.replace(marker, section);
            if (next === current) {
              core.info("Public repository list is already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo: repoName,
              path: "README.md",
              message: "chore: refresh public repository list",
              content: Buffer.from(next).toString("base64"),
              sha: file.sha,
              branch: context.payload.repository?.default_branch || "main"
            });
